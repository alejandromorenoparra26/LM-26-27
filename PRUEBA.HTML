<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Ejercicio 2 - Uso avanzado del grid</title>

  <!-- Bootstrap CSS -->
  <link
    href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
    rel="stylesheet"
  >

  <style>
    body {
      background-color: #ffffff;
      font-family: Arial, sans-serif;
    }

    .ejercicio {
      max-width: 900px;
      margin: 35px auto;
    }

    .titulo {
      font-family: Georgia, "Times New Roman", serif;
      font-size: 2rem;
      font-weight: bold;
    }

    .descripcion {
      font-family: Georgia, "Times New Roman", serif;
      font-size: 1.1rem;
      line-height: 1.35;
      text-align: justify;
    }

    .texto-grid {
      font-size: 1.25rem;
      text-align: center;
      margin: 8px 0 4px;
    }

    .bloque {
      border: 3px solid white;
      min-height: 55px;
    }

    .verde {
      background-color: #00e51c;
      min-height: 28px;
    }

    .rojo {
      background-color: #ff0b0b;
      min-height: 310px;
    }

    .magenta {
      background-color: #ed00ed;
      min-height: 42px;
    }

    .naranja {
      background-color: #ff9855;
      min-height: 105px;
    }

    .azul {
      background-color: #1111e9;
      min-height: 68px;
    }

    /* Ajustes para pantallas pequeñas */
    @media (max-width: 767.98px) {
      .titulo {
        font-size: 1.55rem;
      }

      .descripcion {
        font-size: 1rem;
      }

      .rojo {
        min-height: 120px;
      }

      .naranja {
        min-height: 75px;
      }

      .azul {
        min-height: 50px;
      }
    }
  </style>
</head>

<body>
  <main class="container ejercicio">
    
    <!-- Franja verde superior -->
    <div class="row g-0">
      <div class="col-12 bloque verde"></div>
    </div>

    <!-- Zona principal -->
    <div class="row g-0">
      <!-- Columna roja -->
      <div class="col-12 col-md-3 bloque rojo"></div>

      <!-- Contenido derecho -->
      <div class="col-12 col-md-9">
        <!-- Bloque magenta -->
        <div class="row g-0">
          <div class="col-12 bloque magenta"></div>
        </div>

        <!-- Dos bloques naranjas -->
        <div class="row g-0">
          <div class="col-12 col-lg-6 bloque naranja"></div>
          <div class="col-12 col-lg-6 bloque naranja"></div>
        </div>

        <!-- Cuadrícula azul -->
        <div class="row g-0">
          <div class="col-6 col-md-4 col-lg-2 bloque azul"></div>
          <div class="col-6 col-md-4 col-lg-2 bloque azul"></div>
          <div class="col-6 col-md-4 col-lg-2 bloque azul"></div>
          <div class="col-6 col-md-4 col-lg-2 bloque azul"></div>
          <div class="col-6 col-md-4 col-lg-2 bloque azul"></div>
          <div class="col-6 col-md-4 col-lg-2 bloque azul"></div>
          <div class="col-6 col-md-4 col-lg-2 bloque azul"></div>
          <div class="col-6 col-md-4 col-lg-2 bloque azul"></div>
          <div class="col-6 col-md-4 col-lg-2 bloque azul"></div>
          <div class="col-6 col-md-4 col-lg-2 bloque azul"></div>
          <div class="col-6 col-md-4 col-lg-2 bloque azul"></div>
          <div class="col-6 col-md-4 col-lg-2 bloque azul"></div>
        </div>
      </div>
    </div>

    <!-- Franja verde inferior -->
    <div class="row g-0">
      <div class="col-12 bloque verde"></div>
    </div>
  </main>

  <!-- Bootstrap JS -->
  <script
    src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"
  ></script>
</body>
</html>
