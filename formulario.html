<body>

        <li><a href="galeria.html">Galería</a></li>
        <li><a href="formulario.html">Formulario</a></li>

    <h1>Contacto</h1>

    <h2>Formulario de contacto</h2>

    <form>

        <label>Nombre:</label>
        <br>
        <input type="text">
        <br><br>

        <label>Correo electrónico:</label>
        <br>
        <input type="email">
        <br><br>

        <label>Teléfono:</label>
        <br>
        <input type="tel">
        <br><br>

        <label>¿Qué tipo de inmueble buscas?</label>
        <br>

        <select>
            <option>Casa</option>
            <option>Piso</option>
            <option>Local</option>
            <option>Oficina</option>
        </select>

        <br><br>

        <label>Mensaje:</label>
        <br>
        <textarea rows="5" cols="40"></textarea>

        <br><br>

        <input  type="submit"  value="Enviar">

    </form>

</body>

</html>
